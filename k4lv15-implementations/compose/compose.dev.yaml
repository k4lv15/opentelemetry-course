# Development Environment
# Usage: docker compose -f compose.dev.yaml up --build
#
# Uses 'extends' to inherit service definitions from compose.app.yaml
# and override them with development-specific settings
include:
  - compose.networks.yaml
  - compose.observability.yaml

services:
  redis:
    extends:
      file: compose.app.yaml
      service: redis

  frontend:
    extends:
      file: compose.app.yaml
      service: frontend
    build:
      context: ../../app-versions/code/frontend
      dockerfile: Dockerfile.dev
      target: development
    volumes:
      # Mount source code for hot reload
      - ../../app-versions/code/frontend/src:/app/src:ro
      - ../../app-versions/code/frontend/tsconfig.json:/app/tsconfig.json:ro
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
    command: npm run dev

  worker:
    extends:
      file: compose.app.yaml
      service: worker
    build:
      context: ../../app-versions/code/worker
      dockerfile: Dockerfile.dev
    volumes:
      # Mount source code for hot reload
      - ../../app-versions/code/worker/src:/app/src:ro
      # Preserve translation models (large, slow to download)
      - worker-models:/root/.local/share/argos-translate
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=debug
    command: watchmedo auto-restart --directory=./src --pattern="*.py" --recursive -- python -m src.main

volumes:
  worker-models: